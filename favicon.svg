<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E1B4B" />
      <stop offset="50%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#0B0F19" />
    </linearGradient>

    <!-- Border Gradient -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818CF8" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#6366F1" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#06B6D4" stop-opacity="0.6" />
    </linearGradient>

    <!-- Graduation Cap Gradient -->
    <linearGradient id="capGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818CF8" />
      <stop offset="100%" stop-color="#4F46E5" />
    </linearGradient>

    <!-- AI Sparkle Gradient -->
    <linearGradient id="sparkleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="50%" stop-color="#818CF8" />
      <stop offset="100%" stop-color="#C084FC" />
    </linearGradient>

    <!-- Golden Tassel Gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE047" />
      <stop offset="100%" stop-color="#F59E0B" />
    </linearGradient>

    <!-- Ambient Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Base Squircle Container -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="2.5" />

  <!-- Ambient Glow -->
  <circle cx="30" cy="30" r="16" fill="#6366F1" opacity="0.25" filter="url(#glow)" />

  <!-- Graduation Cap Under-base -->
  <path d="M18 29.5 V37 C18 42, 42 42, 42 37 V29.5 L30 35.5 Z" fill="#312E81" />

  <!-- Graduation Cap Diamond Top -->
  <path d="M30 15 L50 25 L30 35 L10 25 Z" fill="url(#capGrad)" stroke="#A5B4FC" stroke-width="1.2" stroke-linejoin="round" />

  <!-- Cap Button Center -->
  <circle cx="30" cy="25" r="2" fill="#E0E7FF" />

  <!-- Cap Tassel Ribbon & Bead -->
  <path d="M30 25 Q13 25, 12 36" stroke="url(#goldGrad)" stroke-width="2.2" stroke-linecap="round" fill="none" />
  <circle cx="12" cy="36.5" r="2" fill="url(#goldGrad)" />

  <!-- AI Placement Intelligence Sparkle (Top Right) -->
  <path d="M49 8 Q49 17, 58 17 Q49 17, 49 26 Q49 17, 40 17 Q49 17, 49 8 Z" fill="url(#sparkleGrad)" filter="url(#glow)" />

  <!-- Mini Predictive Trend Line (Bottom Growth) -->
  <path d="M20 48 L27 44 L34 46 L44 39" stroke="#38BDF8" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" />
  <circle cx="44" cy="39" r="2.2" fill="#38BDF8" />
  <circle cx="20" cy="48" r="1.5" fill="#38BDF8" opacity="0.7" />
  <circle cx="27" cy="44" r="1.5" fill="#38BDF8" opacity="0.7" />
  <circle cx="34" cy="46" r="1.5" fill="#38BDF8" opacity="0.7" />
</svg>